services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    volumes:
      - graph_mem_db:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-my_password}
      MARIADB_DATABASE: ${DB_NAME:-graph_mem}
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: mysql2://root:${DB_PASSWORD:-my_password}@127.0.0.1:${DB_PORT:-3307}/${DB_NAME:-graph_mem}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_FORCE_SSL: "false"
      # Operator credentials — must be set in production; no defaults here (F3).
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      GRAPH_MEM_GUEST_USERNAME: ${GRAPH_MEM_GUEST_USERNAME:-}
      GRAPH_MEM_GUEST_PASSWORD: ${GRAPH_MEM_GUEST_PASSWORD:-}
      # MCP access control; see docs/mcp_access_control.md
      GRAPH_MEM_MCP_TOKEN: ${GRAPH_MEM_MCP_TOKEN:-}
      GRAPH_MEM_MCP_ALLOWED_IPS: ${GRAPH_MEM_MCP_ALLOWED_IPS:-}
      GRAPH_MEM_MCP_ALLOWED_HOSTS: ${GRAPH_MEM_MCP_ALLOWED_HOSTS:-}
      GRAPH_MEM_MCP_ALLOWED_ORIGINS: ${GRAPH_MEM_MCP_ALLOWED_ORIGINS:-}
      # Scan root = the host user's home, at the SAME path inside the container
      # (docs/container_scan_mounts.md).
      GRAPH_MEM_SCAN_ROOTS: ${GRAPH_MEM_SCAN_HOME:-${HOME}}
      GRAPH_MEM_HOST_HOME: ${HOME:-}                  # refused as one project, even outside /home
      GRAPH_MEM_SCANS: ${GRAPH_MEM_SCANS:-on}            # "off" disables scans without touching the mount
    volumes:
      - ${DB_BACKUP_HOST_PATH:-./db/backup}:/rails/db/backup
      - graph_mem_storage:/rails/storage
      # READ-ONLY. Same path in and out, so /home/<you>/Projects/foo works as typed.
      - ${GRAPH_MEM_SCAN_HOME:-${HOME:?set GRAPH_MEM_SCAN_HOME (HOME is unset)}}:${GRAPH_MEM_SCAN_HOME:-${HOME}}:ro

volumes:
  graph_mem_db:
  graph_mem_storage:
