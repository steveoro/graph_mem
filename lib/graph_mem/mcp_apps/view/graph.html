<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph_mem</title>
<style>
  :root {
    color-scheme: light dark;
    --gm-bg: var(--color-background-primary, Canvas);
    --gm-fg: var(--color-text-primary, CanvasText);
    --gm-muted: var(--color-text-secondary, GrayText);
    --gm-font: var(--font-sans, system-ui, sans-serif);
  }
  body { margin: 0; padding: 12px 16px; background: var(--gm-bg); color: var(--gm-fg); font: 14px/1.4 var(--gm-font); }
  h1 { margin: 0 0 4px; font-size: 16px; }
  p { margin: 4px 0; }
  .muted { color: var(--gm-muted); }
  button { font: inherit; margin-top: 8px; }
</style>
</head>
<body>
<h1 id="title">graph_mem graph view</h1>
<p id="status" class="muted">Waiting for the host…</p>
<p id="count"></p>
<p><button id="details" type="button" hidden>Load entity details</button></p>
<p id="details-status" class="muted"></p>
<script type="module">
/* graph_mem: view scripts */
</script>
</body>
</html>
