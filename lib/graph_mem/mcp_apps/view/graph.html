<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graph_mem</title>
<style>
  /* Host variables (hostContext.styles.variables) win; the fallbacks follow the color scheme. */
  :root {
    color-scheme: light dark;
    --gm-bg: var(--color-background-primary, Canvas);
    --gm-bg-2: var(--color-background-secondary, light-dark(#f4f4f5, #27272a));
    --gm-fg: var(--color-text-primary, CanvasText);
    --gm-muted: var(--color-text-secondary, light-dark(#52525b, #a1a1aa));
    --gm-danger: var(--color-text-danger, light-dark(#b91c1c, #f87171));
    --gm-border: var(--color-border-primary, light-dark(#d4d4d8, #3f3f46));
    --gm-accent: var(--color-ring-primary, light-dark(#2563eb, #60a5fa));
    --gm-font: var(--font-sans, system-ui, sans-serif);
    --gm-radius: var(--border-radius-md, 6px);
    --gm-graph-height: 460px;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  :root.fullscreen { --gm-graph-height: calc(100vh - 120px); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px 12px; background: var(--gm-bg); color: var(--gm-fg); font: 13px/1.4 var(--gm-font); }
  h1 { margin: 0; font-size: 15px; }
  h2 { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
  h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--gm-muted); }
  p { margin: 4px 0; }
  .muted { color: var(--gm-muted); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .spacer { flex: 1; }
  button { font: inherit; color: var(--gm-fg); background: var(--gm-bg-2); border: 1px solid var(--gm-border);
           border-radius: var(--gm-radius); padding: 3px 9px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status.error { color: var(--gm-danger); }
  #note:empty { display: none; }
  .stage { display: flex; gap: 8px; margin: 6px 0; }
  .canvas { position: relative; flex: 1; min-width: 0; }
  #graph { height: var(--gm-graph-height); border: 1px solid var(--gm-border); border-radius: var(--gm-radius); background: var(--gm-bg); }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; padding: 16px; text-align: center; }
  .empty[hidden] { display: none; }
  body.busy button[data-load], body.busy button[data-action], body.busy #search-form button { pointer-events: none; opacity: .5; }
  .modes button[aria-pressed="true"] { border-color: var(--gm-accent); color: var(--gm-accent); }
  body.mode-search .graph-only, body.mode-graph .search-only { display: none !important; }
  #search { flex: 1; min-width: 0; max-height: var(--gm-graph-height); overflow: auto; }
  #search-form input[type="search"], #search-form input[type="text"], #search-form select {
    font: inherit; color: var(--gm-fg); background: var(--gm-bg); border: 1px solid var(--gm-border);
    border-radius: var(--gm-radius); padding: 3px 6px; }
  #search-query { flex: 1; min-width: 160px; }
  #search-form fieldset { border: 0; margin: 0; padding: 0; display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
  #search-hits { margin: 6px 0; padding-left: 22px; }
  #search-hits li { margin: 6px 0; overflow-wrap: anywhere; }
  #search-hits button { padding: 1px 6px; text-align: left; }
  #search-hits .muted { font-size: 12px; }
  #panel { width: 320px; max-height: var(--gm-graph-height); overflow: auto; padding: 8px 10px;
           border: 1px solid var(--gm-border); border-radius: var(--gm-radius); background: var(--gm-bg-2); }
  #panel[hidden] { display: none; }
  #panel ul { margin: 0; padding-left: 18px; }
  #panel li { margin: 3px 0; overflow-wrap: anywhere; }
  .panel-head { display: flex; align-items: flex-start; gap: 8px; }
  .panel-head h2 { flex: 1; }
  @media (max-width: 640px) {
    .stage { flex-direction: column; }
    #panel { width: auto; }
  }
</style>
</head>
<body class="mode-graph">
<header class="bar">
  <h1>graph_mem</h1>
  <span class="bar modes" role="group" aria-label="Mode">
    <button id="mode-graph" type="button" data-mode="graph" aria-pressed="true">Graph</button>
    <button id="mode-search" type="button" data-mode="search" aria-pressed="false">Search</button>
  </span>
  <span id="scope" class="muted graph-only"></span>
  <span class="spacer"></span>
  <button id="load-context" class="graph-only" type="button" data-load="context">Context project</button>
  <button id="load-roots" class="graph-only" type="button" data-load="roots">Root entities</button>
  <button id="fit" class="graph-only" type="button" disabled>Fit</button>
  <button id="fullscreen" type="button" hidden>Fullscreen</button>
</header>
<p id="status" class="muted" role="status">Waiting for the host…</p>
<p id="note" class="muted graph-only"></p>
<div class="stage">
  <div class="canvas graph-only">
    <div id="graph" role="img" aria-label="Graph of graph_mem entities"></div>
    <div id="empty" class="empty" hidden>
      <p id="empty-text">Nothing to draw yet.</p>
      <p class="muted">Load the active project or the root entities (Projects and untyped entities), or search.</p>
      <p class="bar"><button type="button" data-load="context">Context project</button>
        <button type="button" data-load="roots">Root entities</button>
        <button type="button" data-mode="search">Search</button></p>
    </div>
  </div>
  <section id="search" class="search-only" aria-label="Search">
    <!-- Not a form: the sandbox (no allow-forms) blocks a submission before its event fires. -->
    <div id="search-form" role="search">
      <p class="bar">
        <input id="search-query" type="search" maxlength="2048" placeholder="Search entities and observations" aria-label="Query">
        <button id="search-run" type="button">Search</button>
      </p>
      <p class="bar">
        <label>Project <select id="search-project"><option value="">Any</option></select></label>
        <label>Types <input id="search-types" type="text" placeholder="e.g. Task, Issue" size="16"></label>
        <label>Perspective <select id="search-perspective">
          <option value="">Both</option><option value="world">World</option><option value="experience">Experience</option>
        </select></label>
      </p>
      <fieldset><legend class="muted">Match in</legend>
        <label><input type="checkbox" data-field="search_in_name" checked> name</label>
        <label><input type="checkbox" data-field="search_in_type" checked> type</label>
        <label><input type="checkbox" data-field="search_in_aliases" checked> aliases</label>
        <label><input type="checkbox" data-field="search_in_observations" checked> observations</label>
      </fieldset>
    </div>
    <ol id="search-hits"></ol>
    <p class="bar">
      <button id="search-prev" type="button" disabled>Previous</button>
      <span id="search-page" class="muted"></span>
      <button id="search-next" type="button" disabled>Next</button>
      <span class="spacer"></span>
      <button id="search-graph" type="button" disabled>Show as graph</button>
    </p>
  </section>
  <aside id="panel" aria-label="Entity details" hidden>
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" type="button" aria-label="Close the details">Close</button></div>
    <p id="panel-type" class="muted"></p>
    <p id="panel-aliases" class="muted"></p>
    <p class="bar">
      <button type="button" data-action="expand-1">Expand 1</button>
      <button type="button" data-action="expand-2">Expand 2</button>
      <button type="button" data-action="show-project" hidden>Show this project</button>
    </p>
    <p id="panel-status" class="muted"></p>
    <h3>Observations</h3>
    <ul id="panel-observations"></ul>
    <h3>Relations</h3>
    <ul id="panel-relations"></ul>
  </aside>
</div>
<footer class="bar graph-only">
  <span id="counts" class="muted"></span>
  <span class="spacer"></span>
  <span id="selection" class="muted"></span>
  <button id="path" type="button" data-action="path" disabled>Path between selected</button>
</footer>
<script type="module">
/* graph_mem: view scripts */
</script>
</body>
</html>
