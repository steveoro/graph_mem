        map: "Map"
        accept: "Accept"
        accept_label: "Accept %{type} as a known type"
        mappings_title: "Mappings"
        mappings_hint: "Every row of the mapping table. Removing a row changes no relation: the type is unmapped again, and relations already retyped keep their new type."
        mappings_empty: "No mapping rows: the code vocabulary's variants apply."
        mapping_columns:
          variant: "Variant"
          canonical: "Maps to"
          kind: "Kind"
          updated: "Updated"
          actions: "Actions"
        kinds:
          mapped: "mapped"
          accepted: "accepted"
          canonical: "canonical"
        remove: "Remove"
        remove_label: "Remove the mapping of %{type}"
        remove_confirm: "Remove the mapping of %{type}? No relation changes."
      decision:
        mapped:
          one: "%{type} now maps to %{canonical}: the next sweep retypes its 1 relation."
          other: "%{type} now maps to %{canonical}: the next sweep retypes its %{count} relations."
        mapped_part_of:
          one: "%{type} now maps to part_of: the next sweep queues its 1 relation for review (a part_of edge moves membership, so it is applied by hand)."
          other: "%{type} now maps to part_of: the next sweep queues its %{count} relations for review (a part_of edge moves membership, so each is applied by hand)."
        accepted:
          one: "%{type} is accepted as a known type (1 relation); the next sweep stores it in this spelling."
          other: "%{type} is accepted as a known type (%{count} relations); the next sweep stores it in this spelling."
        removed: "The mapping of %{type} is removed. No relation changed."
        blank: "No type was given. Nothing was done."
        too_long: "The type is too long. Nothing was done."
        canonical: "%{type} is a canonical type already. Nothing was done."
        already_mapped: "%{type} is already mapped or accepted. Remove its mapping first to change it."
        not_canonical: "%{canonical} isn't a canonical relation type. Nothing was done."
        not_found: "That mapping no longer exists."
