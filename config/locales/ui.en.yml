      dismiss: "Dismiss"
    changes:
      undo: "Undo"
      conflicts: "%{message}: %{conflicts}"
      not_found: "That change no longer exists."
      busy: "Another merge, import or undo is running. Retry shortly."
    review:
      not_found: "That suggestion no longer exists."
      review_again: "Review the preview again."
      cant_undo: "can't be undone: %{reason}"
      saved: "Suggestion updated."
      done: "Done. Pick the next suggestion."
      policies_queued: "Review policies queued; the numbers update when the run finishes."
      imported: "Imported %{count} new merge suggestion(s)."
      # 1.96.1: the caption under each Review action (ReviewHelper#review_action_caption): the
      # kind's own key, else the action's default. Each says what the action really does.
      actions:
        default:
          preview: "Opens a confirm card with what applying changes; nothing is written yet."
          confirm: "Writes the changes listed above; the undo line above says whether Undo can revert them."
          apply_now: "Applies it now, with no confirm card; Undo in the toast reverts it."
          dismiss: "Not right: nothing changes, and this suggestion isn't made again (Restore brings it back)."
          snooze: "Not now: hidden for %{days} days, then back in the queue at the next policy run."
          restore: "Back to pending, its suppression lifted; an applied change stays applied (Undo reverts that)."
          cancel: "Back to the suggestion; nothing is written."
          save: "Keeps your edits on the suggestion; nothing is applied yet."
          choose: "Opens the suggestion to choose; nothing is written yet."
        contradiction:
          choose: "Opens both sides to keep one; nothing is written yet."
          keep: "Opens a confirm card: keeps #%{id} and marks #%{other} obsolete; Undo brings it back."
          dismiss: "Both facts stay as they are, and this pair isn't flagged again (Restore brings it back)."
        fact_supersede:
          choose: "Opens the fact and #%{id} side by side to supersede or retire it; nothing is written yet."
          supersede: "Opens a confirm card to replace #%{id} with a text you can edit; the old one stays as history, and Undo brings it back."
          retire: "Opens a confirm card to mark #%{id} obsolete, with no replacement; Undo brings it back."
          confirm_supersede: "Replaces #%{id} with this text; the old one stays as history (superseded), and Undo brings it back."
          confirm_retire: "Marks #%{id} obsolete, with no replacement; Undo brings it back."
          dismiss: "The fact doesn't outdate it: nothing changes, and this pair isn't proposed again (Restore brings it back)."
        relation_retype:
          move: "Opens a confirm card: the child leaves %{parent} for %{target} (its scope follows), and the variant edge goes; Undo reverts it."
          keep: "Opens a confirm card: the child stays part_of %{parent}, and the variant becomes relates_to; Undo reverts it."
        relation_review:
          dismiss: "The relation still holds: nothing changes, and this fact isn't flagged against it again (Restore brings it back)."
        delete_entity:
          confirm: "Deletes the entity as listed above; this can't be undone."
        # The group cards (ReviewGroupActions): each opens a confirm card listing the rows it takes.
        group:
          apply_high: "Opens a confirm card for this group's relationship proposals and stale-memory rows at confidence %{confidence} or more (at most %{cap}); nothing is written yet."
          open: "Lists this group's suggestions here; nothing is written."
          dismiss_all: "Opens a confirm card to dismiss this group's pending suggestions (at most %{cap}); nothing is written yet."
          snooze: "Opens a confirm card to hide this group's pending suggestions for %{days} days; nothing is written yet."
          confirm_apply: "Applies the suggestions included above, as one change; Undo in the toast reverts it."
          confirm_dismiss: "Dismisses the suggestions included above: nothing changes in the graph, and they aren't made again (Undo brings them back)."
          confirm_snooze: "Hides the suggestions included above for %{days} days; the next policy run after that brings them back."
      fact_supersede:
        # 1.96.1: what a "context" guard (FactSupersede::LegacyGuard) means (ReviewHelper#review_guard_hint).
        guard_hint: "%{lead} this observation names a version or an environment that the %{fact} doesn't, or it is a work-log entry (true when written). Old isn't wrong, so Dismiss unless the %{fact} really replaces it."
        guard_lead_judged: "The guard disagrees with the judge:"
        guard_lead: "The guard disagrees with this proposal:"
        # 1.96.1: the short note in front of the judge's replacement on the card (the full hint is just above).
        guard_replacement_note: "Written across the guard above: check it before you use it."
        source_fact: "source fact"
        newer_observation: "newer observation"
      contradiction:
        differs: "Differs from the other side: %{own} here, %{other} there"
      keyword_path:
        keywords: "Keywords:"
        llm_words: "LLM topic:"
      lifecycle_corruption:
        repair: "Repair"
        issue: "Found by the integrity sweep: %{issue}."
        now: "Now: %{issue}."
        consistent_now: "Now: the observation is consistent; Repair only resolves this row."
        state: "%{status} · obsoleted_at %{obsoleted_at} · superseded_by %{superseded_by} · outdated_by %{outdated_by}"
        none: "none"
        link: "#%{id} (%{status}, %{entity})"
        same_entity: "same entity"
        other_entity: "entity #%{id}"
        gone: "The observation is gone."
        no_repair: "No automatic repair for a superseded_by on another entity: Dismiss this row, or fix the observation by hand."
      relation_retype:
        summary: "Relation #%{id}: '%{from}' %{old_type} '%{to}' should be %{new_type}."
        membership: "A %{new_type} edge decides membership (one parent, no cycle), so the sweep never writes it: Apply creates it through the normal path and deletes the variant; Dismiss keeps the variant."
        now: "Stored now: %{type}."
        gone: "The relation is gone."
        operation: "Operation: %{operation}."
        has_parent: "%{child} is already part_of %{parent}: choose to move it under this row's target, or to keep its parent."
        move: "Move under %{target}…"
        keep: "Keep %{parent}…"
      relation_review:
        informational_short: "Informational"
        summary: "Relation #%{id}: '%{from}' %{type} '%{to}'. A fact of %{project} says '%{entity}' was removed, replaced or dropped."
        gone: "The relation is gone (Dangling dismisses this row)."
        evidence: "Evidence"
        fact: "#%{id} on %{entity}: %{excerpt}"
        fact_inactive: "Fact #%{id} is no longer active (Dangling dismisses this row)."
        informational: "Informational: nothing is applied. Dismiss it if the relation still holds, or Snooze it. Ending a relation arrives with the relation lifecycle; remove the relation by hand if it is wrong."
      relation_retype_dependency:
        operation:
          swap: "Swap: part_of becomes the project's depends_on"
          add: "Add: the project's depends_on for an orphan"
        swap_endpoints: "'%{library}' part_of '%{project}' becomes '%{project}' depends_on '%{library}': the project uses it rather than owns it."
        add_endpoints: "'%{entity}' has no parent: '%{project}' depends_on '%{entity}' is proposed instead of a part_of."
        gone: "The part_of relation #%{id} is gone."
        no_scope_change: "No scope change: %{entity} keeps its scope."
        evidence: "Evidence"
        entity_type: "Type: %{type} (a dependency-like type, Settings › Review policies)"
        match: "Best project match: score %{score} (tokens: %{tokens})"
        fact: "#%{id} on %{entity}: %{content}"
        no_facts: "No fact of %{project} says it uses this entity."
    guest_search_throttled:
      title: "Too many searches"
      body: "Guests can run up to %{limit} searches a minute. Please wait a moment and try again."
    forbidden:
      title: "Operator only"
      body: "This page needs the operator account. You are signed in as a read-only guest."
      search_link: "Go to Search"
