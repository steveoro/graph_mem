en:
  system:
    settings:
      title: "Settings"
      tabs_label: "Settings groups"
      subtitle: "Feature flags, embeddings, summaries, imports, project scans, telemetry and review policies. Backups and access have their own pages."
      save_group: "Save changes"
      blank_option: "— use ENV / default —"
      blank_uses_env: "Leave blank to use ENV"
      reset: "Reset"
      footer_info: "Changes apply immediately: no need to restart the application. Scheduled backup times are defined in config/recurring.yml."
      groups:
        feature_flags: "Feature Flags"
        backups: "Backup settings"
        embeddings: "Embeddings"
        summaries: "Summaries"
        imports: "Imports"
        project_scans: "Project Scans"
        telemetry: "Telemetry & retention"
        review_policies: "Review policies"
        access: "Access"
      review_policies:
        intro: "Policies run nightly at 5:00 GMT and after a compaction run, stale scan or project scan that queued suggestions. Changes apply on the next run. Every policy action is an undoable change set (Review › Policies)."
        range: "Accepted range: %{min}–%{max}."
        out_of_range: "%{setting} must be between %{min} and %{max} (got %{value}). Nothing was saved."
        snooze_expiry: "Snoozed suggestions always come back when their snooze ends (no toggle)."
        runs_link: "See the policy runs (with Undo) on Review › Policies"
        policies:
          dangling: "Dismisses suggestions that point at something deleted, or whose effect already holds. No suppression. Reverse: Undo the run, or Restore the row."
          no_longer_flagged: "Dismisses stale-memory suggestions the scanner no longer flags. Reverse: Undo the run, or Restore."
          expire_low_confidence: "Expires suggestions with confidence below 0.4 that nobody touched for the days below, and keeps them away for 90 days. Reverse: Undo, or Restore."
          auto_apply_relationships: "Applies high-band relationship proposals at or above the confidence below (never part_of), at most 50 per run. Reverse: Undo the run (removes the relations)."
          auto_apply_expired_validity: "Marks observations obsolete when their own valid_until has passed, at most 100 per run. Reverse: Undo the run."
      mcp_access:
        intro: "Who may reach /mcp (and bearer requests on /api/v1): allowed client IPs, Host names and browser origins. Each list adds to its ENV value, which is shown first and can't be removed here. Changes apply without a restart."
        sessions_notice_title: "Saving a change to allowed hosts or origins closes every open MCP session."
        sessions_notice: "Clients get 404 Session not found on their next call and must start a new session (most reconnect on their own). Changing only the allowed IPs keeps sessions open."
        help: "Adds to the ENV value; it can't remove ENV entries. Not a secret. Operator pages and the operator login aren't behind these lists, so a mistake here can't lock you out."
        unset:
          ips: "unset (default: loopback + private ranges)"
          hosts: "unset (loopback names only)"
          origins: "unset"
        placeholder:
          ips: "10.8.0.0/24, 192.168.1.20"
          hosts: "graphmem.lan, 192.168.1.10:3030"
          origins: "http://graphmem-ui.lan:3001"
        unrestricted: "ENV allows any IP (token set); additions have no effect."
        env_never_matches: "ENV value never matches: %{warning}"
        effective: "In effect:"
        effective_none:
          ips: "none"
          hosts: "none"
          origins: "same-origin pages only"
        public_entry: "%{entry}: public (token required)."
        inactive_no_token: "Inactive: no token is configured, so this entry doesn't apply."
        duplicate: "%{entry}: already set in ENV, not saved again"
        not_saved: "MCP access not saved: %{errors}."
        saved_with_warnings: "Check: %{warnings}."
      bulk_update:
        success: "Saved %{count} setting(s) successfully."
        partial: "Saved %{success} setting(s); %{failed} failed."
        elsewhere: "Not saved from this tab: %{settings} (now on another tab or page; save it there)."
      validation:
        greater_than: "Must be greater than %{value}."
        less_than_or_equal_to: "Must be at most %{value}."
        out_of_range: "%{setting} must be between %{min} and %{max} (got %{value}). Nothing was saved."
        range: "Accepted range: %{min}–%{max}."
      fields:
        mcp_extra_allowed_ips:
          label: "Allowed client IPs"
          description: "Addresses or CIDR ranges (GRAPH_MEM_MCP_ALLOWED_IPS). Public ranges need GRAPH_MEM_MCP_TOKEN; any/all/* can only be set in ENV."
        mcp_extra_allowed_hosts:
          label: "Allowed hosts"
          description: "Host names or IPs that clients use in the URL, with an optional :port (GRAPH_MEM_MCP_ALLOWED_HOSTS). localhost, 127.0.0.1 and ::1 are always accepted."
        mcp_extra_allowed_origins:
          label: "Allowed browser origins"
          description: "Exact scheme://host[:port] of a browser-based MCP client (GRAPH_MEM_MCP_ALLOWED_ORIGINS). Same-origin pages need no entry."
        enable_dream_state_compactor:
          label: "Dream state / compactor"
          description: "When disabled, scheduled and manual dream-state compaction jobs are skipped."
        enable_garbage_collector:
          label: "Garbage collector"
          description: "When disabled, scheduled and manual garbage collection runs are skipped."
        enable_stale_memory_scan:
          label: "Stale memory scan"
          description: "When disabled, the scheduled scan that flags stale observations for review is skipped."
        enable_contradiction_detection:
          label: "Contradiction detection"
          description: "When disabled, the contradiction detector (the stale memory scan and the detect_contradictions endpoint) finds no contradicting observation pairs."
        enable_guest_access:
          label: "Guest access (read-only)"
          description: "Lets the guest account sign in. Has no effect until a guest password is set in GRAPH_MEM_GUEST_PASSWORD or the Rails credentials (guest.password)."
        backup_folder_path:
          label: "Backup folder path"
          description: "Relative to Rails root or an absolute path. Docker deployments should mount this folder as a volume."
        backup_keep_max:
          label: "Maximum backups to keep"
          description: "Oldest managed backups for the current environment are deleted after each successful dump. Legacy manually named files are kept."
        backup_schedule_cron:
          label: "Scheduled backup times"
          description: "Read from config/recurring.yml for the current environment."
        enable_scheduled_backups:
          label: "Enable scheduled backups"
          description: "When enabled, Solid Queue runs DatabaseBackupJob on the schedule shown above."
        embedding_url:
          label: "Embedding server URL"
          description: "Ollama or OpenAI-compatible embedding endpoint. Leave blank to use OLLAMA_URL from the environment."
        embedding_model:
          label: "Embedding model"
          description: "Model name passed to the embedding API. Leave blank to use EMBEDDING_MODEL from the environment."
        embedding_provider:
          label: "Embedding provider"
          description: "ollama or openai_compatible. Leave blank to use EMBEDDING_PROVIDER from the environment."
        embedding_dims:
          label: "Embedding dimensions"
          description: "Expected vector size (e.g. 768). Set to 0 to use EMBEDDING_DIMS from the environment or the default."
        enable_scheduled_embedding_backfill:
          label: "Enable scheduled backfill"
          description: "When enabled, Solid Queue runs a daily backfill job for missing embeddings."
        embedding_backfill_schedule_cron:
          label: "Scheduled backfill times"
          description: "Read from config/recurring.yml for the current environment."
        enable_llm_summarization:
          label: "Enable LLM summarization"
          description: "When disabled, summarize returns deterministic extractive evidence only. The summarize endpoint remains available."
        summary_url:
          label: "Summary server URL"
          description: "Ollama or OpenAI-compatible text-generation endpoint. Leave blank to use SUMMARY_URL or OLLAMA_URL from the environment."
        summary_model:
          label: "Summary model"
          description: "Interchangeable model name passed to the generation API (e.g. qwen3:8b). Leave blank to use SUMMARY_MODEL from the environment."
        summary_provider:
          label: "Summary provider"
          description: "ollama or openai_compatible. Leave blank to use SUMMARY_PROVIDER from the environment."
        summary_timeout:
          label: "Summary timeout (seconds)"
          description: "HTTP timeout for generation requests. Set to 0 to use SUMMARY_TIMEOUT from the environment or the default."
        summary_max_tokens:
          label: "Summary max tokens"
          description: "Maximum output tokens for generated summaries. Set to 0 to use SUMMARY_MAX_TOKENS from the environment or the default."
        summary_observations_per_entity:
          label: "Observations per entity"
          description: "Maximum observations to include per entity before capping. 0 disables the cap. Set to 0 to use SUMMARY_OBSERVATIONS_PER_ENTITY from the environment or the default."
        import_observation_duplicate_max_distance:
          label: "Observation duplicate distance"
          description: "Maximum semantic distance for treating imported observation text as an existing fact. 0.20 is strict and only skips very close paraphrases. 0.50 is broad and may suppress distinct facts. Imports requiring semantic checks are rejected if embeddings are unavailable."
        project_scan_subfolders:
          label: "Subfolder filter"
          description: "Folders inside the scan folder that may be scanned, relative to it (for example: Projects, work/clients), separated by commas or newlines. An absolute path under the scan folder is stored relative. Takes effect immediately for new scans, no restart. A folder that doesn't exist yet is saved and shown as missing."
        enable_project_scan_validation:
          label: "Enable project scan validation"
          description: "When enabled, every project scan finishes with an automatic facts-checking pass over the existing project subtree. Mis-assigned observations and stale relations are either repaired automatically or queued as scan_review items."
        project_scan_validation_batch_size:
          label: "Validation batch size"
          description: "Maximum number of project subtree entities to validate in one batch. When the value is greater than 0, the validation pass pauses after each batch and can be resumed by re-running a validate scan. Use 0 to process all entities in a single run. 0 disables batching (process the whole subtree in one run). A value of 5-10 lets an agent digest the review queue in small, resumable rounds."
        tool_invocation_retention_days:
          label: "Tool telemetry retention (days)"
          description: "Tool invocation rows older than this are deleted by daily garbage collection. Use 0 to disable automatic telemetry pruning."
        enable_review_policy_dangling:
          label: "Dismiss dangling suggestions"
        enable_review_policy_no_longer_flagged:
          label: "Dismiss stale-memory suggestions no longer flagged"
        enable_review_policy_expire_low_confidence:
          label: "Expire old low-confidence suggestions"
        enable_auto_apply_relationships:
          label: "Auto-apply high-confidence relationships"
        enable_auto_apply_expired_validity:
          label: "Auto-apply expired validity (stale memory)"
        review_backlog_ceiling:
          label: "Backlog ceiling per kind"
          description: "Active suggestions per kind before new ones must beat the lowest priority to be queued (a soft limit)."
        review_attention_threshold:
          label: "Attention threshold"
          description: "Suggestions at or above this priority show on the Review digest and count in the nav badge."
        review_expire_low_confidence_days:
          label: "Expire low-confidence after (days)"
          description: "How long a low-confidence suggestion stays untouched before the expire policy closes it."
        auto_apply_relationship_min_confidence:
          label: "Auto-apply relationship confidence"
          description: "Minimum confidence for auto-applying relationship proposals."
        compaction_review_row_retention_days:
          label: "Review rows retention (days)"
          description: "Approved, dismissed and ignored review rows older than this are pruned daily. Suggestions you dismissed stay suppressed; ignored ones may be proposed again. 0 uses the default (30)."
      backup:
        actions_title: "Manual backup"
        list_title: "Available backups"
        empty: "No backup files found in the backup folder."
        run_now: "Run backup now"
        run_confirm: "Create a new database backup now?"
        run_success: "Database backup completed successfully."
        run_failed: "Database backup failed: %{error}"
        restore: "Restore"
        restore_confirm: "Restore database from %{filename}? This will DROP and recreate the current database."
        restore_success: "Database restored from %{filename}."
        restore_failed: "Restore failed: %{error}"
        delete: "Delete"
        delete_confirm: "Delete backup file %{filename}? This cannot be undone."
        delete_success: "Deleted backup %{filename}."
        delete_failed: "Delete failed: %{error}"
        columns:
          filename: "Filename"
          size: "Size"
          modified: "Modified"
          actions: "Actions"
      embeddings:
        used_when_blank: "Used when blank:"
        priority_hint: "Configuration priority: AppSettings (this tab) → environment variables → built-in defaults. Workers pick up changes after save."
        manage_link: "Open embeddings dashboard"
        test_title: "Connection test"
        invalid_provider: "Invalid embedding provider. Use ollama or openai_compatible."
        invalid_dims: "Dimensions must be 0 (use ENV/default) or between 1 and 4096."
        invalid_url: "Embedding URL must be a valid http or https URL."
      summaries:
        used_when_blank: "Used when blank:"
        priority_hint: "Configuration priority: AppSettings (this tab) → environment variables → built-in defaults. Changes apply on the next summarize request."
        deterministic_hint: "When LLM summarization is disabled or unavailable, summarize returns deterministic extractive evidence with source IDs."
        invalid_provider: "Invalid summary provider. Use ollama or openai_compatible."
        invalid_timeout: "Timeout must be 0 (use ENV/default) or between 1 and 300 seconds."
        invalid_max_tokens: "Max tokens must be 0 (use ENV/default) or between 16 and 4096."
        invalid_observations_per_entity: "Observations per entity must be 0 (use ENV/default) or between 0 and 100."
        invalid_url: "Summary URL must be a valid http or https URL."
      imports:
        invalid_observation_duplicate_max_distance: "Observation duplicate distance must be between 0.20 and 0.50."
      project_scans:
        invalid_subfolders: "Subfolder filter not saved: %{errors}."
        whole_home: "The filter is blank, so the whole scan folder is scannable (hidden folders and secret files are still blocked)."
        folders_title: "Scan folders"
        folder: "Folder"
        mounted: "Mounted"
        access: "Access"
        readable: "Readable"
        native: "native"
        read_only: "read-only"
        read_write: "read-write: use :ro"
        switched_off: "Scans are switched off (GRAPH_MEM_SCANS=off)."
        nothing_mounted: "Scans are disabled: nothing is mounted. Add this volume line to the app service in docker-compose.yml:"
        docs_hint: "See docs/container_scan_mounts.md."
        running_as_root: "graph_mem is running as root, so the scan folder is /root."
        exists: "✓ exists"
        missing: "missing"
        rejected: "rejected: %{reason}"
        legacy_ignored: "Legacy scan roots value ignored: %{value}"
        legacy_clear: "Clear"
        legacy_cleared: "The legacy scan roots value was cleared."
        check_title: "Check a path"
        check_button: "Check"
        blocked_title: "Always blocked"
        blocked_hint: "These can never be scanned, whatever the settings say."
        blocked_folders: "Folders:"
        blocked_files: "Files inside a project:"
