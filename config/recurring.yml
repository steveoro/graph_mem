development:
  dream_state_compaction:
    class: DreamStateCompactionJob
    queue: default
    schedule: every hour
  stale_memory_scan:
    class: StaleMemoryScanJob
    queue: low_priority
    schedule: every hour
  embedding_backfill:
    class: EmbeddingScheduledBackfillJob
    queue: low_priority
    schedule: every day at 4am
  # 1.77.0: facts whose keyword path a write-time request missed.
  fact_keywords:
    class: FactKeywordsJob
    queue: low_priority
    schedule: every day at 4:15am
  review_policy:
    class: ReviewPolicyJob
    queue: low_priority
    schedule: at 5:00am every day
  maintenance_report_row_cleanup:
    class: MaintenanceReportRowCleanupJob
    queue: low_priority
    schedule: at 5:15am every day
  change_set_prune:
    class: ChangeSetPruneJob
    queue: low_priority
    schedule: at 5:30am every day
  # ExportJob writes tmp/exports/export_<id>.json; Projects › Exports answers 410 once it's gone.
  export_cleanup:
    command: "ExportJob.cleanup_old_exports"
    queue: low_priority
    schedule: every hour

production:
  garbage_collection:
    class: GarbageCollectionJob
    queue: default
    schedule: at 2pm every day
  dream_state_compaction:
    class: DreamStateCompactionJob
    queue: default
    schedule: at 3am every day
  stale_memory_scan:
    class: StaleMemoryScanJob
    queue: low_priority
    schedule: at 4:30am every day
  # NOTE: All times are in Greenwich Mean Time (GMT)
  database_backup_at_13:
    class: DatabaseBackupJob
    queue: low_priority
    schedule: every day at 1pm
  database_backup_at_17:
    class: DatabaseBackupJob
    queue: low_priority
    schedule: every day at 5pm
  embedding_backfill:
    class: EmbeddingScheduledBackfillJob
    queue: low_priority
    schedule: at 4am every day
  fact_keywords:
    class: FactKeywordsJob
    queue: low_priority
    schedule: at 4:15am every day
  review_policy:
    class: ReviewPolicyJob
    queue: low_priority
    schedule: at 5:00am every day
  maintenance_report_row_cleanup:
    class: MaintenanceReportRowCleanupJob
    queue: low_priority
    schedule: at 5:15am every day
  change_set_prune:
    class: ChangeSetPruneJob
    queue: low_priority
    schedule: at 5:30am every day
  # ExportJob writes tmp/exports/export_<id>.json; Projects › Exports answers 410 once it's gone.
  export_cleanup:
    command: "ExportJob.cleanup_old_exports"
    queue: low_priority
    schedule: every hour
  # 1.86.0: a machine that is off at night misses the slots above (Solid Queue skips a missed one):
  # start "Run all scheduled jobs now" by itself when nothing ran lately. Not in ScheduledRun's steps.
  scheduled_run_catch_up:
    class: ScheduledRunCatchUpJob
    queue: default
    schedule: every 15 minutes
