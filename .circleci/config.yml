version: 2.1
orbs:
  ruby: circleci/ruby@4.0.0
  browser-tools: circleci/browser-tools@2.4.2

ruby: &ruby
  image: cimg/ruby:3.4.12
  environment:
    RAILS_ENV: test
    BUNDLE_JOBS: 2
    BUNDLE_RETRY: 2
    PAGER: cat
    DB_PASSWORD: Password123!

common: &common
  resource_class: medium
  working_directory: ~/graph_mem
  shell: /bin/bash --login

jobs:
  rubocop:
    <<: *common
    docker:
      - *ruby
    steps:
      - checkout
      - ruby/install-deps:
          key: graph_mem-v2
      - run:
          name: Rubocop
          command: bundle exec rubocop

  brakeman:
    <<: *common
    docker:
      - *ruby
    steps:
      - checkout
      - ruby/install-deps:
          key: graph_mem-v2
      - run:
          name: Brakeman
          command: bundle exec brakeman

  rspec:
    <<: *common
    docker:
      # System specs need Chrome, so only this job uses the -browsers image.
      - <<: *ruby
        image: cimg/ruby:3.4.12-browsers
      - image: cimg/mariadb:11.8.6
        environment:
          MARIADB_ROOT_PASSWORD: Password123!
    steps:
      - checkout
      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - run:
          name: Verify browser tools
          command: google-chrome --version && chromedriver --version
      - run:
          name: Install database client
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mariadb-client
      - ruby/install-deps:
          key: graph_mem-v2
      - run:
          name: DB setup
          command: |
            cp config/database.ci.yml config/database.yml
            dockerize -wait tcp://localhost:3306 -timeout 2m
            bin/rails db:create db:schema:load
      - run:
          name: RSpec
          command: bundle exec rspec
      - store_artifacts:
          path: tmp/capybara

workflows:
  test:
    jobs:
      - rubocop
      - brakeman

      - rspec:
          requires:
            - brakeman
            - rubocop
